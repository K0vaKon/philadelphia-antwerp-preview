name: Update latest YouTube videos

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Update the three latest uploads
        run: python3 scripts/update-latest-videos.py

      - name: Commit updated video data
        run: |
          if git diff --quiet -- latest-videos.json; then
            echo "The latest video data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-videos.json
          git commit -m "Update latest YouTube videos"
          git push

      - name: Trigger hosting deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-to-hosting.yml --ref main
